[project]
name = "hack-backend"
version = "0.1.0"
description = "Sinpex Hackathon 2026 — federated search backend (template)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # http2 extra: the Wikidata SPARQL endpoint's WAF requires HTTP/2.
    "httpx[http2]>=0.27",
    # MCP servers (app/mcp_servers/*) expose the keyless GLEIF & Wikidata APIs.
    "mcp>=1.0",
    # Handelsregister MCP server scrapes the JSF portal (no API): browser + parser.
    "mechanize>=0.4",
    "beautifulsoup4>=4.12",
    "certifi",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
