# Local development. NOT what runs in Cloud Run — that uses the Dockerfile.
#
# Two services, hot reload on both:
#   - backend on :8080 (uvicorn --reload)
#   - frontend on :5173 (vite dev, proxies /api/* to backend)
#
# Open http://localhost:5173 for the app. Direct API at http://localhost:8080/api/health.
#
# First `docker compose up` is slow (installs deps); subsequent ones are fast
# thanks to the named volumes caching .venv and node_modules.

services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    command: >
      bash -lc "
        pip install --quiet --no-cache-dir uv==0.7.5 &&
        uv sync &&
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
      "
    volumes:
      - ./backend:/app/backend
      - backend-venv:/app/backend/.venv
    ports:
      - "8080:8080"
    env_file:
      # Carries ANTHROPIC_API_KEY (+ register keys) into the container. With a
      # key the matching (semantic-filter) runs for real; without one the chain
      # falls back to deterministic stubs. NOTE: do NOT also list the key under
      # `environment:` — a bare, host-unset var can inject an empty value that
      # overrides this file and silently forces mock mode.
      - path: .env
        required: false

  frontend:
    image: node:20-slim
    working_dir: /frontend
    command: >
      bash -lc "
        npm install --silent &&
        npm run dev -- --host 0.0.0.0
      "
    volumes:
      - ./frontend:/frontend
      - frontend-node-modules:/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-venv:
  frontend-node-modules:
