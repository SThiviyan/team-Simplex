# Declarative secret requests for this repo.
#
# Each entry maps an env-var name (mounted into Cloud Run) to a Secret Manager
# secret. The deploy workflow reads this file and constructs the gcloud
# --set-secrets flag automatically.
#
# By default the template requests NO secrets — your service runs without any
# mounted env vars. Uncomment / add entries as your team needs them.
#
# To request a new secret:
#   1. Add an entry below (PR).
#   2. The Sinpex hackathon team approves and runs `scripts/grant-secrets.sh <repo> <secret>`.
#   3. They populate the secret value via `gcloud secrets versions add`.
#   4. Merge the PR; the next deploy mounts it.

secrets:
  # Anthropic key for the registry-lookup pipeline (shared org secret).
  - env: ANTHROPIC_API_KEY
    secret: hack-anthropic-key

  # Companies House REST key (free) — upgrades GB from web-search to registry-verified.
  # - env: UK_COMPANY_HOUSE_KEY
  #   secret: team-simplex-companies-house-key
  # NZBN API subscription key (free tier).
  # - env: NZBN_API_KEY
  #   secret: team-simplex-nzbn-key
  # AJPES (Slovenian PRS) credentials.
  # - env: AJPES_USER
  #   secret: team-simplex-ajpes-user
  # - env: AJPES_PASSWORD
  #   secret: team-simplex-ajpes-password
  # - env: AJPES_SCHEMA
  #   secret: team-simplex-ajpes-schema
  # KVK (Dutch register) PRODUCTION key — without it the NL connector uses KVK's
  # public test endpoint (synthetic data only). Set this for real Dutch companies.
  # - env: KVK_API_KEY
  #   secret: team-simplex-kvk-key

  # Apify token — enables the PAID actor-backed sources, above all NorthData
  # (the DE/AT/CH Handelsregister path that bypasses handelsregister.de's IP
  # block). PROD-ONLY: the actors cost money (limited ~€5 budget), so they run
  # ONLY when BOTH this token is mounted AND APIFY_ENABLED=true. In dev/non-prod
  # APIFY_ENABLED defaults to false -> every Apify provider self-skips (€0).
  # - env: APIFY_API_KEY
  #   secret: team-simplex-apify-key
  # APIFY_ENABLED is a plain flag, not a secret — set it to "true" in the prod
  # deploy env (and leave it unset/false everywhere else) to turn NorthData on.

  # Example — a team-specific LLM key:
  #
  # Example — a team-specific secret (the Sinpex hackathon team creates this on request):
  # - env: OPENAI_API_KEY
  #   secret: team-<yourname>-openai-key
  # - env: DATABASE_URL
  #   secret: team-<yourname>-database-url
